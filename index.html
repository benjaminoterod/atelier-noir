<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATELIER NOIR™ — Drop 01</title>
<meta name="description" content="Streetwear chileno. Drop 01: polerón AN-H03 Paneles, 100% algodón 550 g/m², corte relajado, en cuatro colores. Prochainement.">
<meta name="theme-color" content="#ECE6DA">
<meta property="og:title" content="ATELIER NOIR™ — Drop 01">
<meta property="og:description" content="Polerón AN-H03 Paneles. Pesado, relajado, sans bruit.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://benjaminoterod.github.io/atelier-noir/assets/portada.webp">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#ECE6DA; --cream-2:#E3DCCD; --ink:#0E0E0E; --mute:#6b665c; --line:rgba(14,14,14,.14);
  --gut:clamp(16px,3.2vw,44px);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:60;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 calc(var(--gut) - 10px);color:var(--ink);background:var(--cream);box-shadow:0 1px 0 var(--line);transition:background .35s var(--ease),color .35s var(--ease),box-shadow .35s}
.top.over{background:linear-gradient(rgba(8,8,12,.5),rgba(8,8,12,0));background-repeat:no-repeat;box-shadow:none;color:var(--cream)}
.top .side{display:flex;align-items:center;gap:2px}
.top .side.r{justify-content:flex-end}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:background .2s}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:rgba(127,127,127,.18)}
.badge{position:absolute;top:4px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:var(--cream);font-size:10px;line-height:16px;text-align:center}
.top.over .badge{background:var(--cream);color:var(--ink)}
.badge[hidden]{display:none}
.logo{position:relative;display:block;width:42px;height:34px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.logo .lc{opacity:0}
.top.over .logo .lc{opacity:1}
.top.over .logo .ld{opacity:0}

/* ---------- paneles (menú, búsqueda, carrito) ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.5);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;z-index:80;width:min(460px,100vw);background:var(--cream);color:var(--ink);display:flex;flex-direction:column;visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.panel.l{left:0;transform:translateX(-102%)}
.panel.r{right:0;transform:translateX(102%)}
.panel.on{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.panel-h{display:flex;align-items:center;justify-content:space-between;height:64px;flex:none;padding:0 calc(var(--gut) - 10px) 0 var(--gut);border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.panel-b{flex:1;overflow:auto;padding:var(--gut)}
.menu a{display:block;font-family:var(--serif);font-size:clamp(34px,5vw,46px);line-height:1.15;padding:5px 0}
.menu a:hover{font-style:italic}
.menu .sub{display:grid;margin:2px 0 14px 2px}
.menu .sub a{font-family:var(--sans);font-size:15px;padding:8px 0;display:flex;align-items:center;gap:10px;color:#3a372f}
.menu .sub a:hover{font-style:normal;color:var(--ink)}
.menu .sub i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
.menu .fine{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px}
.menu .fine a{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 0}
.menu .fine a:hover{font-style:normal;color:var(--ink)}
.search{position:fixed;left:0;right:0;top:0;z-index:80;max-height:92vh;overflow:auto;background:var(--cream);color:var(--ink);visibility:hidden;transform:translateY(-102%);transition:transform .45s var(--ease),visibility 0s .45s}
.search.on{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.search form{display:flex;align-items:center;gap:8px;height:64px;padding:0 calc(var(--gut) - 10px) 0 var(--gut);border-bottom:1px solid var(--line)}
.search input{flex:1;min-width:0;font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);background:none;border:0;outline:0;color:var(--ink)}
.search input::placeholder{color:#9a9488}
.res{padding:18px var(--gut) 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.res a{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);transition:border-color .2s}
.res a:hover,.res a:focus-visible{border-color:var(--ink)}
.res img{width:54px;height:72px;object-fit:cover;background:var(--cream-2)}
.res b{font-weight:500;display:block}
.res small{color:var(--mute)}
.res .none{grid-column:1/-1;color:var(--mute)}
.res .lbl{grid-column:1/-1;margin:0}
.cart-empty{text-align:center;padding:48px 8px;color:#3a372f}
.cart-empty h3{font-family:var(--serif);font-weight:400;font-size:34px;margin-bottom:8px}
.ci{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.ci img{width:72px;height:96px;object-fit:cover;background:var(--cream-2)}
.ci b{font-weight:500;display:block}
.ci small{display:block;color:var(--mute)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px}
.qty button{width:30px;height:30px}
.qty span{min-width:26px;text-align:center;font-size:13px}
.ci .rm{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.cart-f{flex:none;border-top:1px solid var(--line);padding:16px var(--gut) calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}
.cart-f .tot{display:flex;justify-content:space-between;font-size:16px}
.cart-f .btn{justify-content:center;width:100%}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:540px;overflow:hidden;color:var(--cream);background:#0b0b10}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 35%;will-change:transform}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,5,10,.3),rgba(5,5,10,0) 26%,rgba(5,5,10,0) 42%,rgba(5,5,10,.78));pointer-events:none}
.hero-copy{position:absolute;z-index:2;left:var(--gut);right:var(--gut);bottom:clamp(26px,6vh,64px);max-width:760px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.hero .eyebrow{color:rgba(236,230,218,.82)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(50px,9vw,132px);line-height:.92;letter-spacing:-.01em;margin:10px 0 14px}
.hero h1 em{font-style:italic}
.lead{max-width:44ch;color:rgba(236,230,218,.92)}
.hero .cta-row{justify-content:flex-start}
.hero .btn{border-color:var(--cream)}
.hero .btn.solid{background:var(--cream);color:var(--ink)}
.hero .btn.solid:hover{background:transparent;color:var(--cream)}
.hero .btn.ghost:hover{background:var(--cream);color:var(--ink)}
section{scroll-margin-top:64px}
.cta-row{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);transition:background .25s,color .25s,transform .2s}
.btn.solid{background:var(--ink);color:var(--cream)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--cream)}
.btn:active{transform:scale(.98)}

/* intro */
@media (prefers-reduced-motion:no-preference){
  .hero>img{animation:fadein 1.4s var(--ease) both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .hero-copy{opacity:0;animation:rise .9s var(--ease) .5s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .rv.in{opacity:1;transform:none}
}

/* ---------- secciones ---------- */
section{padding:clamp(56px,9vw,120px) var(--gut)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:28px;border-top:1px solid var(--line);padding-top:14px}
.sec-h h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,52px);line-height:1}
.sec-h span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.4vw,20px)}
.card{display:block}
.card .ph{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--cream-2)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .55s var(--ease),transform 1.1s var(--ease)}
.card .ph img+img{opacity:0}
.card:hover .ph img+img,.card:focus-visible .ph img+img{opacity:1}
.card:hover .ph img{transform:scale(1.03)}
.card .cap{display:flex;justify-content:space-between;gap:10px;padding-top:12px;font-size:13px}
.card .cap b{font-weight:500}
.card .cap small{color:var(--mute);font-size:12px}
.tag{position:absolute;left:10px;top:10px;z-index:2;background:var(--cream);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:5px 8px}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,3vw,44px)}
.facts div{border-top:1px solid var(--ink);padding-top:12px}
.facts h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.05;margin-bottom:6px}
.facts p{color:#3a372f;font-size:14px}

.soon{text-align:center;border-top:1px solid var(--line)}
.soon h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,7vw,96px);line-height:.95;margin:10px 0 14px}
.soon h2 em{font-style:italic}
.soon p{max-width:44ch;margin:0 auto;color:#3a372f}

footer{padding:28px var(--gut) 36px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
footer a:hover{color:var(--ink)}

/* ---------- producto ---------- */
.pdp{padding-top:84px}
.crumb{padding:6px var(--gut) 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--mute)}
.crumb a:hover{color:var(--ink)}
.strip-wrap{position:relative}
.strip{display:flex;gap:clamp(8px,1vw,14px);overflow-x:auto;scroll-snap-type:x proximity;padding:0 var(--gut);scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip.drag{cursor:grabbing;scroll-snap-type:none}
.strip figure{flex:none;height:min(76vh,860px);scroll-snap-align:start;background:var(--cream-2);position:relative}
.strip figure img{height:100%;width:auto;user-select:none;-webkit-user-drag:none}
.strip figure.mock{background:#F3EFE6;padding:3vh 2vw}
.strip figure.mock img{object-fit:contain;max-width:none}
.strip figcaption{position:absolute;left:10px;bottom:10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--cream);padding:4px 8px}
.ctrl{display:flex;align-items:center;gap:14px;padding:14px var(--gut) 0}
.ctrl .bar{flex:1;height:1px;background:var(--line);position:relative}
.ctrl .bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:10%;transition:width .2s}
.ctrl button{width:42px;height:42px;border:1px solid var(--ink);display:grid;place-items:center;font-size:16px;transition:background .2s,color .2s}
.ctrl button:hover{background:var(--ink);color:var(--cream)}
.ctrl .n{font-size:12px;letter-spacing:.14em;min-width:64px}

.info{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,80px);padding:clamp(36px,6vw,84px) var(--gut) 0}
.info h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,84px);line-height:.95}
.info h1 em{font-style:italic}
.price{margin-top:14px;font-size:18px}
.price small{color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-left:8px}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw a{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--line);font-size:13px;transition:border-color .2s}
.sw a i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.sw a:hover{border-color:var(--ink)}
.sw a[aria-current=true]{border-color:var(--ink);background:rgba(14,14,14,.05)}
.sizes{display:flex;gap:10px}
.sizes button{width:56px;height:46px;border:1px solid var(--line);font-size:14px;transition:all .2s}
.sizes button:hover{border-color:var(--ink)}
.sizes button[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
tr.on td{background:rgba(14,14,14,.06);font-weight:500}
.desc p{margin-bottom:12px;color:#2b2923;max-width:56ch}
.desc ul{list-style:none;margin:16px 0}
.desc li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:14px}
.desc li span:first-child{color:var(--mute);flex:none}
.desc li span:last-child{text-align:right}
.buy{margin-top:24px;display:flex;flex-direction:column;gap:10px;max-width:420px}
.buy .btn{justify-content:center;width:100%;padding:16px 22px}
.note{font-size:12px;color:var(--mute);margin-top:4px}
.more{padding-bottom:20px}

@media (max-width:900px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .info{grid-template-columns:1fr}
}
@media (max-width:640px){
  .hero>img{object-position:58% 30%}
  .strip figure{height:62vh}
  .facts{grid-template-columns:1fr}
  .sec-h span{display:none}
}
</style>
</head>
<body>

<header class="top over" id="top">
  <div class="side">
    <button class="ib" id="btnMenu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h17M3.5 12h17M3.5 17h17"/></svg></button>
  </div>
  <a class="logo" href="#/" aria-label="ATELIER NOIR — inicio"><img class="ld" src="assets/logo.png" alt="ATELIER NOIR" width="42" height="34"><img class="lc" src="assets/logo-crema.png" alt="" aria-hidden="true" width="42" height="34"></a>
  <div class="side r">
    <button class="ib" id="btnSearch" aria-label="Buscar" aria-expanded="false" aria-controls="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button class="ib" id="btnCart" aria-label="Carrito" aria-expanded="false" aria-controls="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5h2.3l2.1 10.7h10.2l2-7.9H6.2"/><circle cx="9.6" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg><span class="badge" id="badge" hidden>0</span></button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<aside class="panel l" id="menu" aria-label="Menú">
  <div class="panel-h"><span>Menú</span><button class="ib" data-close aria-label="Cerrar menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <nav class="panel-b menu" id="menuNav"></nav>
</aside>

<div class="search" id="search" role="dialog" aria-label="Buscar">
  <form id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;flex:none"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="Buscar" aria-label="Buscar productos" enterkeyhint="search">
    <button type="button" class="ib" data-close aria-label="Cerrar búsqueda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </form>
  <div class="res" id="res"></div>
</div>

<aside class="panel r" id="cart" aria-label="Carrito">
  <div class="panel-h"><span>Carrito</span><button class="ib" data-close aria-label="Cerrar carrito"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <div class="panel-b" id="cartBody"></div>
  <div class="cart-f" id="cartFoot" hidden></div>
</aside>

<main id="app" tabindex="-1"></main>

<footer>
  <span>ATELIER NOIR™ · Hecho en Chile</span>
  <a href="https://www.instagram.com/ateliernoir.cl/" target="_blank" rel="noopener">@ateliernoir.cl</a>
</footer>

<script src="assets/manifest.js"></script>
<script>
/* ===== Ajustes fáciles ===== */
const CONFIG = {
  preventaAbierta: false,        // cambia a true cuando abras la preventa
  precio: 54990,                 // precio de ejemplo: edítalo
  ig: 'ateliernoir.cl'
};
const COLORS = {
  negro:  {name:'Negro',       fr:'Noir',   hex:'#141414'},
  marino: {name:'Azul marino', fr:'Marine', hex:'#1c2335'},
  gris:   {name:'Gris',        fr:'Gris',   hex:'#4a4a4a'},
  cafe:   {name:'Café',        fr:'Café',   hex:'#4a2f22'}
};
const ORDER = ['negro','marino','gris','cafe'];
const SIZES = {M:{pecho:64,largo:62,manga:57.5}, L:{pecho:67,largo:65,manga:59.5}, XL:{pecho:70,largo:68,manga:61.5}};
const money = n => '$' + n.toLocaleString('es-CL');
const M = window.MANIFEST;
const app = document.getElementById('app');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
let cleanup = [];
let currentColor = 'negro';

const img = (o, alt, extra='') => `<img src="${o.src}" width="${o.w}" height="${o.h}" alt="${alt}" ${extra}>`;
const igLink = () => `https://ig.me/m/${CONFIG.ig}`;

/* ===== Portada ===== */
function viewHome(){
  document.title = 'ATELIER NOIR™ — Drop 01';
  app.innerHTML = `
  <section class="hero" aria-label="Portada">
    <img src="assets/portada.webp" width="3340" height="1884" alt="Modelo con la capucha del polerón AN-H03 puesta, sobre un cielo al atardecer" fetchpriority="high">
    <h1 class="sr">ATELIER NOIR — Drop 01, polerón AN-H03 Paneles</h1>
  </section>

  <section id="coleccion" aria-label="Colores">
    <div class="sec-h rv"><h2>AN-H03 Paneles</h2><span>4 colores · M — L — XL</span></div>
    <div class="grid4">
      ${ORDER.map((c,i)=>`
      <a class="card rv" style="transition-delay:${i*70}ms" href="#/p/${c}" aria-label="Ver AN-H03 ${COLORS[c].name}">
        <div class="ph">
          <span class="tag">Drop 01</span>
          ${img(M[c].photos[0],`AN-H03 Paneles ${COLORS[c].name}`,'loading="lazy"')}
          ${img(M[c].photos[1]||M[c].photos[0],'','loading="lazy" aria-hidden="true"')}
        </div>
        <div class="cap"><span><b>${COLORS[c].name}</b><br><small>${COLORS[c].fr}</small></span><span>${money(CONFIG.precio)}</span></div>

/* ===== Producto ===== */

  document.title = `AN-H03 Paneles ${col.name} — ATELIER NOIR™`;

    ...d.photos.map((o,i)=>({o,cls:'',alt:`AN-H03 Paneles ${col.name}, foto ${i+1}`,cap:''})),
    ...d.mockups.map(o=>({o,cls:'mock',alt:`Mockup ${o.label} del polerón ${col.name}`,cap:'Mockup · '+o.label}))
  ];

  app.innerHTML = `
  <div class="pdp">
    <div class="crumb"><a href="#/">← Drop 01</a><span>AN-H03 Paneles</span></div>
    <div class="strip-wrap">
      <div class="strip" id="strip" tabindex="0" aria-label="Fotos del producto">

      </div>

        <button id="prev" aria-label="Anterior">←</button>

        <div class="bar"><i id="prog"></i></div>
        <button id="next" aria-label="Siguiente">→</button>
      </div>
    </div>

    <div class="info">
      <div>
        <div class="eyebrow">Drop 01 · AN-H03</div>
        <h1>Paneles,<br><em>${col.name.toLowerCase()}</em></h1>
        <div class="price">${money(CONFIG.precio)} <small>CLP · ${CONFIG.preventaAbierta?'Preventa':'Prochainement'}</small></div>

        <div class="lbl">Color</div>
        <div class="sw">
          <a href="#/p/${c}" aria-current="true"><i style="background:${col.hex}"></i>${col.name}</a>
          ${others.map(o=>`<a href="#/p/${o}"><i style="background:${COLORS[o].hex}"></i>${COLORS[o].name}</a>`).join('')}
        </div>

        <div class="lbl">Talla</div>
        <div class="sizes" role="group" aria-label="Talla">
          ${Object.keys(SIZES).map((s,i)=>`<button data-s="${s}" aria-pressed="${i===1}">${s}</button>`).join('')}
        </div>

        <div class="buy">
          ${CONFIG.preventaAbierta
            ? `<button class="btn solid" id="buy" type="button">Précommande · Añadir al carrito</button><span class="note">Pides por Instagram desde el carrito y el pago se coordina ahí.</span>`
            : `<a class="btn solid" href="${igLink()}" target="_blank" rel="noopener">Avísame cuando abra</a><span class="note">Prochainement. Escríbenos por Instagram y te avisamos primero.</span>`}
        </div>
      </div>

      <div class="desc">
        <p>Polerón de felpa pesada, corte relajado y hombro caído. Dos líneas horizontales con borde sin terminar al frente y en la espalda, y una costura vertical abierta en cada manga.</p>
        <ul>
          <li><span>Tela</span><span>100% algodón · 550 g/m² · perchado</span></li>
          <li><span>Efecto</span><span>Desteñido, sin rotos ni lijado</span></li>
          <li><span>Capucha</span><span>Capa simple, sin cordones</span></li>
          <li><span>Detalles</span><span>“ATELIER” bordado · “SANS” en relieve</span></li>
          <li><span>Puños y pretina</span><span>Rib 1x1 grueso</span></li>
        </ul>
        <div class="lbl" style="margin-top:22px">Medidas (cm, prenda plana)</div>
        <table id="tbl"><thead><tr><th>Talla</th><th>Pecho</th><th>Largo</th><th>Manga</th></tr></thead>
          <tbody>${Object.entries(SIZES).map(([s,v])=>`<tr data-s="${s}"><td>${s}</td><td>${v.pecho}</td><td>${v.largo}</td><td>${v.manga}</td></tr>`).join('')}</tbody></table>
        <p class="note" style="margin-top:10px">Tolerancia ± 1 cm.</p>
      </div>
    </div>
    <section class="more"><div class="sec-h"><h2>Otros colores</h2><span>AN-H03</span></div>
      <div class="grid4">
        ${others.map(o=>`<a class="card" href="#/p/${o}"><div class="ph">${img(M[o].photos[0],`AN-H03 ${COLORS[o].name}`,'loading="lazy"')}${img(M[o].photos[1]||M[o].photos[0],'','loading="lazy" aria-hidden="true"')}</div><div class="cap"><span><b>${COLORS[o].name}</b></span><span>${money(CONFIG.precio)}</span></div></a>`).join('')}

function initSizes(){
  const btns=[...app.querySelectorAll('.sizes button')], rows=[...app.querySelectorAll('#tbl tbody tr')];
  let sel='L';
  const set=s=>{sel=s;btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));rows.forEach(r=>r.classList.toggle('on',r.dataset.s===s));};
  btns.forEach(b=>b.addEventListener('click',()=>set(b.dataset.s))); set('L');
  const buy=document.getElementById('buy');
  if(buy) buy.addEventListener('click',()=>{addToCart(currentColor,sel);openPanel('cart');});
}

function initStrip(total){
  const s=document.getElementById('strip'), cnt=document.getElementById('count'), prog=document.getElementById('prog');
  const figs=[...s.children];
  const upd=()=>{
    const max=s.scrollWidth-s.clientWidth;
    prog.style.width=Math.max(8,(max>0?s.scrollLeft/max:1)*100)+'%';
    let idx=0,best=1e9; figs.forEach((f,i)=>{const d=Math.abs(f.offsetLeft-s.scrollLeft-parseFloat(getComputedStyle(s).paddingLeft));if(d<best){best=d;idx=i;}});
    if(max>0&&s.scrollLeft>=max-4) idx=total-1;
    cnt.textContent=String(idx+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  };
  const step=()=>Math.max(260,figs[0].getBoundingClientRect().width+14);
  const go=dir=>s.scrollBy({left:dir*step(),behavior:reduce?'auto':'smooth'});
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  s.addEventListener('scroll',upd,{passive:true}); upd();
  s.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
  /* arrastrar con mouse */
  let down=false,sx=0,sl=0,moved=false;
  s.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=s.scrollLeft;s.classList.add('drag');});
  const mv=e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>3)moved=true;s.scrollLeft=sl-dx;};
  const up=()=>{down=false;s.classList.remove('drag');};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
  cleanup.push(()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);});
  window.addEventListener('resize',upd); cleanup.push(()=>window.removeEventListener('resize',upd));
}

/* ===== efectos ===== */
function startReveal(){
  const els=[...app.querySelectorAll('.rv')];
  if(reduce||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>io.observe(e)); cleanup.push(()=>io.disconnect());
}
function startParallax(){
  if(reduce) return;
  const im=app.querySelector('.hero>img'); if(!im) return; let t=false;
  const run=()=>{t=false;const y=Math.min(scrollY,innerHeight);im.style.transform=`translate3d(0,${Math.round(y*.18)}px,0)`;};
  const on=()=>{if(!t){t=true;requestAnimationFrame(run);}};
  window.addEventListener('scroll',on,{passive:true}); cleanup.push(()=>window.removeEventListener('scroll',on));
}

/* ===== barra superior ===== */
const topbar=document.getElementById('top');
function setHeader(){
  const onHome=!!app.querySelector('.hero');
  const over=onHome && scrollY < innerHeight*.8 - 64;
  topbar.classList.toggle('over',over);
}
addEventListener('scroll',setHeader,{passive:true});
addEventListener('resize',setHeader);

/* ===== paneles: menú, búsqueda, carrito ===== */
const scrim=document.getElementById('scrim');
const panels={menu:document.getElementById('menu'),search:document.getElementById('search'),cart:document.getElementById('cart')};
const triggers={menu:document.getElementById('btnMenu'),search:document.getElementById('btnSearch'),cart:document.getElementById('btnCart')};
let openName=null;
function openPanel(n){
  if(openName===n) return closePanel();
  if(openName) panels[openName].classList.remove('on'),triggers[openName].setAttribute('aria-expanded','false');
  openName=n; panels[n].classList.add('on'); triggers[n].setAttribute('aria-expanded','true');
  scrim.classList.add('on'); document.body.style.overflow='hidden';
  if(n==='cart') renderCart();
  if(n==='search'){ renderSearch(''); setTimeout(()=>document.getElementById('q').focus(),60); }
  else setTimeout(()=>panels[n].querySelector('a,button,input')?.focus(),60);
}
function closePanel(){
  if(!openName) return;
  const n=openName; openName=null;
  panels[n].classList.remove('on'); triggers[n].setAttribute('aria-expanded','false');
  scrim.classList.remove('on'); document.body.style.overflow='';
  triggers[n].focus({preventScroll:true});
}
Object.keys(triggers).forEach(n=>triggers[n].addEventListener('click',()=>openPanel(n)));
scrim.addEventListener('click',closePanel);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closePanel));
addEventListener('keydown',e=>{if(e.key==='Escape') closePanel();});

/* menú */
document.getElementById('menuNav').innerHTML=`
  <a href="#/">Inicio</a>
  <a href="#/#coleccion" data-go="coleccion">Drop 01</a>
  <div class="sub">${ORDER.map(c=>`<a href="#/p/${c}"><i style="background:${COLORS[c].hex}"></i>AN-H03 · ${COLORS[c].name}</a>`).join('')}</div>
  <a href="#/#detalles" data-go="detalles">Detalles</a>
  <a href="#/#preventa" data-go="preventa">Précommande</a>
  <div class="fine">
    <a href="https://www.instagram.com/ateliernoir.cl/" target="_blank" rel="noopener">Instagram · @${CONFIG.ig}</a>
    <a href="${igLink()}" target="_blank" rel="noopener">Escríbenos</a>
  </div>`;
document.getElementById('menuNav').addEventListener('click',e=>{if(e.target.closest('a')) setTimeout(closePanel,0);});

/* búsqueda */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function searchItems(q){
  q=norm(q.trim());
  return ORDER.filter(c=>{
    const hay=norm(`${COLORS[c].name} ${COLORS[c].fr} polero poleron hoodie capucha paneles an-h03 drop 01 atelier noir`);
    return !q || q.split(/\s+/).every(w=>hay.includes(w));
  });
}
function renderSearch(q){
  const r=searchItems(q), box=document.getElementById('res');
  box.innerHTML = r.length
    ? (q?'':'<div class="lbl">Drop 01</div>')+r.map(c=>`<a href="#/p/${c}"><img src="${M[c].photos[0].src}" alt="" loading="lazy"><span><b>AN-H03 Paneles</b><small>${COLORS[c].name} · ${money(CONFIG.precio)}</small></span></a>`).join('')
    : `<p class="none">Sin resultados para “${q.replace(/[<>&]/g,'')}”. Prueba con “negro” o “polerón”.</p>`;
}
document.getElementById('q').addEventListener('input',e=>renderSearch(e.target.value));
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const a=document.querySelector('#res a');if(a){location.hash=a.getAttribute('href');closePanel();}});
document.getElementById('res').addEventListener('click',e=>{if(e.target.closest('a')) setTimeout(closePanel,0);});

/* carrito (se guarda en este navegador) */
let cart=[];
try{cart=JSON.parse(localStorage.getItem('an_cart')||'[]')}catch(_){cart=[]}
const saveCart=()=>{try{localStorage.setItem('an_cart',JSON.stringify(cart))}catch(_){}};
const cartCount=()=>cart.reduce((n,i)=>n+i.qty,0);
function addToCart(color,size){
  const it=cart.find(i=>i.color===color&&i.size===size);
  if(it) it.qty++; else cart.push({color,size,qty:1});
  saveCart(); updateBadge();
}
function updateBadge(){const b=document.getElementById('badge'),n=cartCount();b.hidden=!n;b.textContent=n;}
function renderCart(){
  const body=document.getElementById('cartBody'), foot=document.getElementById('cartFoot');
  if(!cart.length){
    body.innerHTML=`<div class="cart-empty"><h3>Tu carrito está vacío</h3><p>${CONFIG.preventaAbierta?'Elige un color y una talla para empezar.':'La preventa del drop 01 abre prochainement.'}</p><div class="cta-row"><a class="btn solid" href="#/#coleccion" data-go="coleccion">Ver los colores</a></div></div>`;
    foot.hidden=true; return;
  }
  body.innerHTML=cart.map((i,k)=>`<div class="ci"><img src="${M[i.color].photos[0].src}" alt=""><div><b>AN-H03 Paneles</b><small>${COLORS[i.color].name} · Talla ${i.size}</small><div class="qty"><button data-q="-1" data-k="${k}" aria-label="Menos">−</button><span>${i.qty}</span><button data-q="1" data-k="${k}" aria-label="Más">+</button></div></div><div style="text-align:right">${money(CONFIG.precio*i.qty)}<br><button class="rm" data-rm="${k}">Quitar</button></div></div>`).join('');
  const total=cart.reduce((n,i)=>n+CONFIG.precio*i.qty,0);
  foot.hidden=false;
  foot.innerHTML=`<div class="tot"><span>Total</span><b>${money(total)}</b></div><button class="btn solid" id="order">Pedir por Instagram</button><span class="note">Copiamos tu pedido; pégalo en el mensaje. El pago se coordina por ahí.</span>`;
  document.getElementById('order').onclick=()=>{
    const txt='Hola ATELIER NOIR, quiero pedir:\n'+cart.map(i=>`- AN-H03 Paneles ${COLORS[i.color].name}, talla ${i.size} x${i.qty}`).join('\n')+`\nTotal: ${money(total)}`;
    try{navigator.clipboard.writeText(txt)}catch(_){}
    window.open(igLink(),'_blank','noopener');
  };
}
document.getElementById('cartBody').addEventListener('click',e=>{
  const q=e.target.closest('[data-q]'), r=e.target.closest('[data-rm]');
  if(q){const i=cart[+q.dataset.k]; i.qty+=+q.dataset.q; if(i.qty<1) cart.splice(+q.dataset.k,1);}
  else if(r){cart.splice(+r.dataset.rm,1);}
  else return;
  saveCart(); updateBadge(); renderCart();
});
updateBadge();

/* ===== router ===== */
function route(){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=location.hash.replace(/^#\/?/,'');
  const [path,anchor]=h.split('#');
  const m=path.match(/^p\/(\w+)/);
  if(m) viewProduct(m[1]); else viewHome();
  setHeader();
  if(anchor){ requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView({behavior:reduce?'auto':'smooth'})); }
  else window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]'); if(!a) return;
  e.preventDefault(); const id=a.dataset.go;
  if(!document.getElementById(id)){ location.hash='#/#'+id; return; }
  document.getElementById(id).scrollIntoView({behavior:reduce?'auto':'smooth'});
});
addEventListener('hashchange',route);
route();
</script>
